# Literal prompt-injection phrases, grouped by detection rule.
#
# These are fixed phrases, matched by an Aho-Corasick automaton rather than a regex:
# matching stays O(n) in the text no matter how many phrases the list grows to.
#
# Phrases are matched case-insensitively against text whose whitespace runs have been
# collapsed to single spaces, so write them with single spaces here.

[[rule]]
id = "instruction_override"
category = "override"
